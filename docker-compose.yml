version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: health-dashboard-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-dashboard-backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:password@mongodb:27017/health-dashboard?authSource=admin
      PORT: 5000
      JWT_SECRET: your_jwt_secret_key_change_this
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-dashboard-frontend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  default:
    name: health-dashboard-network
